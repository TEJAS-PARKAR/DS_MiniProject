# Experimental Matrix Configuration
version: "1.0"

suites:
  baseline:
    name: "A. Baseline Evaluation"
    description: "4 nodes, zero packet loss, low contention, no faults"
    node_counts: [4]
    algorithms: ["ricart_agrawala", "suzuki_kasami", "raymond_tree"]
    loss_rates: [0.0]
    network_delays_ms: [5.0]
    contention_levels: ["low"]
    seeds: [42, 43, 44]

  scalability:
    name: "B. Scalability Evaluation"
    description: "Evaluates algorithm overhead with increasing node counts"
    node_counts: [4, 8, 16]
    algorithms: ["ricart_agrawala", "suzuki_kasami", "raymond_tree"]
    loss_rates: [0.0]
    network_delays_ms: [5.0]
    contention_levels: ["medium"]
    seeds: [100, 101]

  network_delay:
    name: "C. Network Delay Sensitivity"
    description: "Evaluates impact of varying network round-trip latencies"
    node_counts: [4]
    algorithms: ["ricart_agrawala", "suzuki_kasami", "raymond_tree"]
    loss_rates: [0.0]
    network_delays_ms: [1.0, 10.0, 50.0]
    contention_levels: ["medium"]
    seeds: [200, 201]

  contention:
    name: "D. Contention Sweep"
    description: "Low, medium, and high arrival rates under mutual exclusion"
    node_counts: [4]
    algorithms: ["ricart_agrawala", "suzuki_kasami", "raymond_tree"]
    loss_rates: [0.0]
    network_delays_ms: [5.0]
    contention_levels: ["low", "medium", "high"]
    seeds: [300, 301]

  message_loss:
    name: "E. Message Loss Resilience"
    description: "Packet loss injected at 0%, 1%, and 5%"
    node_counts: [4]
    algorithms: ["ricart_agrawala", "suzuki_kasami", "raymond_tree"]
    loss_rates: [0.0, 0.01, 0.05]
    network_delays_ms: [5.0]
    contention_levels: ["medium"]
    seeds: [400, 401]
